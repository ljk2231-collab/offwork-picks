<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>퇴근로그 (@offwork_log) — 내돈내산 실사용 정착템 리스트</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #1f1e1c;
      --sub: #6e6a63;
      --accent: #e04f33;
      --accent-soft: #fff0ed;
      --border: #ece7e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 60px;
    }
    .ftc-banner {
      background: #262422;
      color: #f3efe9;
      font-size: 11.5px;
      text-align: center;
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      letter-spacing: -0.2px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8dfd5, #cbbba8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .profile-info h1 {
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .profile-info p {
      font-size: 12.5px;
      color: var(--sub);
      margin-top: 2px;
    }
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }
    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--sub);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .item-card.top-pick {
      border: 2px solid var(--accent);
      background: linear-gradient(180deg, #fff9f7 0%, #ffffff 45%);
    }
    .item-card:active {
      transform: scale(0.985);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .num-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f1ede7;
      color: #3d3934;
    }
    .item-card.top-pick .num-badge {
      background: var(--accent);
      color: #fff;
    }
    .tag-badge {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-body {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .thumb {
      width: 78px;
      height: 78px;
      border-radius: 10px;
      object-fit: cover;
      background: #f5f2ed;
      flex-shrink: 0;
      border: 1px solid #f0ece6;
    }
    .info {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
      word-break: keep-all;
    }
    .comment {
      font-size: 12.5px;
      color: var(--sub);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .go-btn {
      font-size: 12px;
      font-weight: 700;
      background: var(--text);
      color: #fff;
      padding: 6px 11px;
      border-radius: 8px;
    }
    .item-card.top-pick .go-btn {
      background: var(--accent);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11.5px;
      color: #99938b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ftc-banner">
    이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
  </div>
  <div class="container">
    <div class="profile-header">
      <div class="avatar">🌙</div>
      <div class="profile-info">
        <h1>퇴근로그 (@offwork_log) 정착템</h1>
        <p>5년차 자취 직장인의 내돈내산 삶의 질 수직상승 리스트</p>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="번호(예: 1, 2) 또는 상품명·키워드 검색..." />
    </div>

    <div class="cat-tabs" id="catTabs">
      <button class="cat-btn active" data-cat="ALL">전체</button>
      <button class="cat-btn" data-cat="야근회복·꿀잠">야근회복·꿀잠</button>
      <button class="cat-btn" data-cat="칼퇴·데스크템">칼퇴·데스크템</button>
      <button class="cat-btn" data-cat="퇴근후·야식치트키">퇴근후·야식</button>
      <button class="cat-btn" data-cat="피부과할부방어">피부·이너뷰티</button>
    </div>

    <div class="item-list" id="itemList"></div>

    <div class="footer-note">
      쓰레드 게시글에서 안내된 번호를 누르시면 쿠팡 로켓배송 페이지로 바로 이동합니다.
    </div>
  </div>

  <script>
    let ITEMS = [];
    let currentCat = "ALL";

    function trackClick(item) {
      try {
        const logs = JSON.parse(localStorage.getItem("offwork_clicks") || "[]");
        logs.push({ no: item.no, title: item.title, ts: new Date().toISOString() });
        localStorage.setItem("offwork_clicks", JSON.stringify(logs.slice(-100)));
      } catch (e) {}
    }

    function render() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const listEl = document.getElementById("itemList");
      const filtered = ITEMS.filter(it => {
        if (currentCat !== "ALL" && it.category !== currentCat) return false;
        if (!q) return true;
        if (String(it.no) === q.replace("#", "").replace("번", "")) return true;
        return (it.title + " " + it.comment + " " + it.category + " " + it.badge).toLowerCase().includes(q);
      });

      listEl.innerHTML = filtered.map(it => `
        <a class="item-card ${it.is_top ? 'top-pick' : ''}" href="${it.link}" target="_blank" rel="noopener" onclick='trackClick(${JSON.stringify({no: it.no, title: it.title})})'>
          <div class="card-top">
            <span class="num-badge">#${it.no}번 정착템</span>
            <span class="tag-badge">${it.badge}</span>
          </div>
          <div class="card-body">
            <img class="thumb" src="${it.image}" alt="${it.title}" loading="lazy" />
            <div class="info">
              <div class="title">${it.title}</div>
              <div class="comment">${it.comment}</div>
              <div class="cta-row">
                <span class="price">로켓배송 ${it.price}</span>
                <span class="go-btn">쿠팡 바로가기 →</span>
              </div>
            </div>
          </div>
        </a>
      `).join("");
    }

    async function init() {
      try {
        const res = await fetch("./items.json?t=" + Date.now());
        ITEMS = await res.json();
      } catch (e) {
        ITEMS = [];
      }
      const params = new URLSearchParams(location.search);
      const pickNo = params.get("no");
      if (pickNo) {
        document.getElementById("searchInput").value = pickNo;
      }
      render();
    }

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("catTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      render();
    });

    init();
  </script>
</body>
</html>
